name: Terraform Validate

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"

# Avoid piling up redundant runs when new commits land on the same PR.
concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"

jobs:
  fmt:
    name: terraform fmt (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Checks formatting across the whole terraform/ tree in one pass.
      # `-check` fails the job (non-zero exit) instead of rewriting files.
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff terraform/

  validate:
    name: terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stg, prd]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # No backend and no AWS credentials are configured or required here:
      # `-backend=false` skips backend initialization entirely, and
      # `validate` only checks internal consistency (types, references,
      # required arguments) — it never talks to AWS.
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  # Placeholder for the natural next step in a real pipeline: on `pull_request`,
  # run `terraform plan` per environment against real (read-only) AWS
  # credentials obtained via GitHub OIDC, and post the plan as a PR comment.
  # Left out here since this exercise intentionally requires no AWS access.
  # plan:
  #   needs: validate
  #   ...
